services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ecommerce

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce-metabase

    ports:
      - "3000:3000"

    depends_on:
      - postgres


volumes:
  postgres_data: